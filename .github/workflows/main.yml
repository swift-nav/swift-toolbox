---
name: main

'on':
  push:
    branches:
      - 'main'
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:

env:
  PIP_CACHE_DIR: ~/.cache/pip
  RUST_CACHE_DIRS: "~/.cargo/registry\n~/.cargo/git\ntarget\n"
  LIBCLANG_PATH_WIN: "C:/Program Files/LLVM/bin"
  CODE_SIGNER_PATH_WIN: "%win10sdk%/x64/signtool.exe"
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-C debuginfo=0"
  APP_NAME: swift-console
  APP_BUNDLE_ID: com.swift-nav.SwiftConsole

permissions:
  contents: read

jobs:
  backend_bench:
    name: Backend Benchmarks
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          ssh-key: ${{ secrets.SSH_KEY }}
          ssh-strict: false
          persist-credentials: false

      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Run ssh-keyscan
        shell: bash
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Setup SSH for Windows Git LFS
        run: |
          & "C:\\Program Files\\Git\\bin\\sh.exe" -c "ssh-keyscan github.com >> ~/.ssh/known_hosts"
          & "C:\\Program Files\\Git\\bin\\sh.exe" -c "echo '${{ secrets.SSH_KEY }}' >> ~/.ssh/id_rsa"
        if: runner.os == 'Windows'

      - name: Install ${{ runner.os }} Dependencies.
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
              # Drop the preinstalled Microsoft/Azure apt repos; their InRelease files
              # intermittently break signing and none of our deps come from them.
              sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* || true
              sudo apt-get update && sudo apt-get install -y capnproto libudev-dev libssl-dev
          elif [ "$RUNNER_OS" == "macOS" ]; then
              brew install capnp llvm
          elif [ "$RUNNER_OS" == "Windows" ]; then
              choco install -y capnproto
              echo "LIBCLANG_PATH=${{ env.LIBCLANG_PATH_WIN }}" >> $GITHUB_ENV
              # windows-2025 ships Visual Studio 2026; swiftnav-sys's pinned cmake 0.1.49
              # can't auto-detect it, so set the generator explicitly to skip detection.
              echo "CMAKE_GENERATOR=Visual Studio 18 2026" >> $GITHUB_ENV
          fi

      - name: Pull Git LFS objects
        run: git lfs pull
        env:
          GIT_SSH_COMMAND: ssh -o StrictHostKeyChecking=no

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # zizmor: ignore[cache-poisoning] job publishes nothing; release builds run in swift-toolbox-ci.
          key: ${{ secrets.CACHE_VERSION }}

      - uses: davidB/rust-cargo-make@eb4338cc4e8145107109b722ee749f23e61455f0 # v1.17.0

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # zizmor: ignore[cache-poisoning] job publishes nothing; release builds run in swift-toolbox-ci.
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pyproject-toml-${{ secrets.CACHE_VERSION }}-${{ hashFiles('pyproject.toml') }}

      - name: Install ImageMagick
        shell: bash
        run: cargo make install-imagemagick

      - name: Set up python builder
        shell: bash
        run: cargo make setup-builder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Backend Benchmarks
        run: cargo make backend-benches

  checks:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          ssh-key: ${{ secrets.SSH_KEY }}
          ssh-strict: false
          persist-credentials: false

      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Pull Git LFS objects
        run: git lfs pull
        env:
          GIT_SSH_COMMAND: ssh -o StrictHostKeyChecking=no

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # zizmor: ignore[cache-poisoning] job publishes nothing; release builds run in swift-toolbox-ci.
          key: ${{ secrets.CACHE_VERSION }}

      - uses: davidB/rust-cargo-make@eb4338cc4e8145107109b722ee749f23e61455f0 # v1.17.0

      - name: Install Dependencies.
        run: |
          # Drop the preinstalled Microsoft/Azure apt repos; their InRelease files
          # intermittently break signing and none of our deps come from them.
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* || true
          sudo apt-get update && sudo apt-get install -y capnproto libudev-dev libssl-dev

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # zizmor: ignore[cache-poisoning] job publishes nothing; release builds run in swift-toolbox-ci.
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pyproject-toml-${{ secrets.CACHE_VERSION }}-${{ hashFiles('pyproject.toml') }}

      - name: Install ImageMagick
        shell: bash
        run: cargo make install-imagemagick

      - name: Set up python builder
        run: cargo make setup-builder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.4.3'
          setup-python: false
          aqtversion: '==3.1.6'

      - name: Run Checks
        run: cargo make check-all

      # TODO Fix qmllint warnings [CPP-798]
      - name: Run qmllint
        continue-on-error: true
        run: cargo make qml-lint

      - name: Run Tests
        uses: nick-invision/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_on: error
          command: cargo make tests

  frontend_distribute:
    name: Run frontend benchmarks, build, sign and distribute
    needs: [checks, backend_bench]
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
        run: echo "SHOULD_RELEASE=true" >> $GITHUB_ENV

      - shell: bash
        run: echo "VERSION=${GITHUB_REF##*/}" >> $GITHUB_ENV

      - uses: convictional/trigger-workflow-and-wait@f69fa9eedd3c62a599220f4d5745230e237904be # v1.6.5
        with:
          owner: swift-nav
          repo: swift-toolbox-ci
          ref: main
          workflow_file_name: distribute.yml
          client_payload: >-
            {
            "branch": "${{ github.head_ref || github.ref_name }}",
            "run_id": "${{ github.run_id }}",
            "should_release": "${{ env.SHOULD_RELEASE || false}}",
            "version": "${{ env.VERSION }}",
            "pr_number": "${{ github.event.number }}"
            }
          github_token: ${{ secrets.GH_TOKEN }}
          propagate_failure: true
          wait_workflow: true
          trigger_workflow: true
          wait_interval: 30
