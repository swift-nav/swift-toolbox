name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [review_requested, ready_for_review]
  issues:
    types: [opened]

jobs:
  claude_review:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: swift-nav/swift-context-hub/.github/workflows/claude.yml@77d222c292b46306566342c9331e49897de6fbdd # v0.4.0
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

